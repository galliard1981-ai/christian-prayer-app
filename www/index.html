<!DOCTYPE html>
<html lang="en" data-mode="ortho" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="description" content="A virtual prayer companion for the Christian prayer rope and rosary — Orthodox κομποσχοίνι and Catholic rosary in one app, with prayers in 20 languages.">
<meta property="og:title" content="Christian Prayer — Rope & Rosary">
<meta property="og:description" content="A virtual prayer companion for the Christian prayer rope and rosary — Orthodox κομποσχοίνι and Catholic rosary in one app.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Christian Prayer">
<meta name="mobile-web-app-capable" content="yes">
<title>Christian Prayer — Rope & Rosary</title>
<style>
:root { --step: 52px; }

:root[data-theme="dark"] {
  --bg:#0d0f12; --fg:#f3f4f6; --muted:#9ca3af; --panel:#171a20; --border:#2b313b;
  --accent:#fef08a; --focus:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.6);
}
:root[data-theme="light"] {
  --bg:#f6f1e7; --fg:#1f2937; --muted:#6b7280; --panel:#fffdf8; --border:#d9d0bd;
  --accent:#92400e; --focus:rgba(0,0,0,.05); --shadow:rgba(0,0,0,.3);
}
/* Ορθόδοξο κομποσχοίνι — το συνηθισμένο μαύρο μαλλί, με ευδιάκριτο σχήμα μέσω φωτισμού */
:root[data-mode="ortho"][data-theme="dark"] {
  --bg:#14100c; --cord:#221b14; --cord-hi:#4c3f2e; --cord-lo:#070503; --hatch:rgba(0,0,0,.55);
  --knot-hi:#5c5142; --knot-mid:#1c1712; --knot-lo:#020202; --metal:#d8c08a;
}
:root[data-mode="ortho"][data-theme="light"] {
  --bg:#f6f1e7; --cord:#2a2520; --cord-hi:#4a4034; --cord-lo:#100d0a; --hatch:rgba(255,255,255,.14);
  --knot-hi:#4a433b; --knot-mid:#1f1b16; --knot-lo:#050403; --metal:#6b5a3d;
}
/* Καθολικό ροζάριο */
:root[data-mode="rosary"][data-theme="dark"] {
  --bg:#0a0e1a; --cord:#94a3b8; --cord-hi:#e2e8f0; --cord-lo:#3f4c60; --accent:#fde68a; --panel:#131a2b; --border:#25304a;
  --b-hi:#fffdf5; --b-mid:#d9d3c0; --b-lo:#8b8570;
  --big-hi:#f87171; --big-mid:#b91c1c; --big-lo:#5f0f0f; --metal:#c7d2e6;
}
:root[data-mode="rosary"][data-theme="light"] {
  --bg:#eaf0f9; --cord:#64748b; --cord-hi:#a9b6c8; --cord-lo:#33404f; --accent:#1e3a8a; --panel:#ffffff; --border:#c7d2e6; --fg:#0f172a;
  --b-hi:#93c5fd; --b-mid:#1e40af; --b-lo:#0b1a4d;
  --big-hi:#fca5a5; --big-mid:#b91c1c; --big-lo:#5f0f0f; --metal:#334155;
}

[hidden] { display: none !important; }
* { -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden; overscroll-behavior: none;
  user-select: none; -webkit-user-select: none;
  transition: background-color .3s, color .3s;
}
body { display: flex; flex-direction: column; align-items: center; }
html[dir="rtl"] .counters, html[dir="rtl"] .row .txt { text-align: right; }

header {
  width: 100%; box-sizing: border-box; z-index: 10;
  padding: max(env(safe-area-inset-top), 12px) 12px 0;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.topbar { width: 100%; max-width: 460px; display: flex; align-items: center; gap: 8px; }
.tabs { flex: 1; display: flex; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
.tab {
  flex: 1; border: 0; background: transparent; color: var(--muted);
  padding: 9px 6px; border-radius: 999px; font: inherit; font-size: .82rem; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
.icon-btn {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel); color: var(--fg);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn svg { width: 20px; height: 20px; }
:root[data-theme="dark"] .i-moon { display: none; }
:root[data-theme="light"] .i-sun { display: none; }
.counters { font-size: 1.05rem; letter-spacing: .5px; color: var(--muted); text-align: center; }
.counters span { color: var(--fg); font-weight: bold; }

#stage {
  flex: 1; min-height: 0; width: 100%; position: relative;
  display: flex; justify-content: center; touch-action: none; cursor: grab; overflow: hidden;
}
#stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: radial-gradient(ellipse 60% 55% at 50% 42%, transparent 45%, color-mix(in srgb, var(--bg) 40%, black) 100%);
}
.glow {
  position: absolute; top: 50%; left: 50%; width: 92%; height: 96%;
  transform: translate(-50%, -50%); border-radius: 48%; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 60% 90% at 50% 50%, color-mix(in srgb, var(--accent) 30%, transparent) 0%, color-mix(in srgb, var(--accent) 14%, transparent) 45%, transparent 78%);
  filter: blur(28px);
}
:root[data-mode="ortho"][data-theme="dark"] .glow {
  width: 96%; height: 98%; filter: blur(38px); opacity: 1;
  background: radial-gradient(ellipse 65% 92% at 50% 50%, color-mix(in srgb, var(--accent) 38%, transparent) 0%, color-mix(in srgb, var(--accent) 18%, transparent) 42%, transparent 80%);
}
.pendant {
  position: absolute; bottom: 5%; left: 50%; z-index: 0; opacity: .92;
  transform-origin: top center; animation: sway 4.5s ease-in-out infinite;
}
@keyframes sway {
  0%, 100% { transform: translateX(-50%) rotate(-3deg); }
  50% { transform: translateX(-50%) rotate(3deg); }
}
.pendant svg { width: 26px; height: 40px; display: block; filter: drop-shadow(0 3px 4px var(--shadow)); }
.start-hint {
  position: absolute; top: 10%; left: 0; right: 0; text-align: center; z-index: 4;
  color: var(--muted); font-size: .9rem; padding: 0 24px; pointer-events: none;
  animation: hintPulse 2.2s ease-in-out infinite; transition: opacity .4s;
}
@keyframes hintPulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.rope {
  position: relative; width: 120px; height: 100%; overflow: hidden; z-index: 1;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 85%, transparent);
          mask-image: linear-gradient(to bottom, transparent, #000 15%, #000 85%, transparent);
}
.rope.pulse { animation: pulse .55s ease; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.cord { position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%); z-index: 1; }
:root[data-mode="ortho"] .cord {
  width: 11px; border-radius: 5px;
  background: repeating-linear-gradient(118deg,
    var(--cord-hi) 0 3px, var(--cord) 3px 6px, var(--cord-lo) 6px 9px);
  box-shadow: inset 2px 0 3px rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.45);
}
:root[data-mode="ortho"][data-theme="dark"] .cord {
  box-shadow: inset 2px 0 4px rgba(255,255,255,.2), inset -3px 0 5px rgba(0,0,0,.65), 0 0 10px rgba(0,0,0,.55);
}
:root[data-mode="rosary"] .cord {
  width: 5px; border-radius: 3px;
  background: repeating-linear-gradient(to bottom,
    var(--cord-lo) 0 2px, var(--cord) 2px 6px, var(--cord-hi) 6px 8px, var(--cord) 8px 12px);
  box-shadow: inset 1px 0 2px rgba(255,255,255,.2), inset -1px 0 2px rgba(0,0,0,.35);
}
#track { position: absolute; left: 0; right: 0; will-change: transform; z-index: 2; }
.slot { height: var(--step); display: flex; align-items: center; justify-content: center; position: relative; }
.slot:nth-child(odd) .knot, .slot:nth-child(odd) .bead { transform: rotate(-5deg); }
.slot:nth-child(even) .knot, .slot:nth-child(even) .bead { transform: rotate(4deg); }

.knot, .bead { position: relative; }
.knot::before, .bead::before {
  content: ""; position: absolute; left: 50%; bottom: -7px; z-index: -1;
  width: 68%; height: 9px; transform: translateX(-50%);
  border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
}
.knot::after, .bead::after {
  content: ""; position: absolute; top: 15%; left: 20%; width: 32%; height: 20%;
  background: rgba(255,255,255,.55); border-radius: 50%; filter: blur(1px);
}
.knot {
  width: 36px; height: 28px; border-radius: 50% / 46%;
  background:
    repeating-linear-gradient(60deg, var(--hatch) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-60deg, var(--hatch) 0 2px, transparent 2px 6px),
    radial-gradient(circle at 35% 30%, var(--knot-hi), var(--knot-mid) 60%, var(--knot-lo));
  box-shadow: 0 4px 10px var(--shadow), inset 1px 1px 2px rgba(255,255,255,.2), inset -2px -2px 4px rgba(0,0,0,.4);
}
:root[data-mode="ortho"][data-theme="dark"] .knot {
  box-shadow: 0 0 0 1px rgba(255,240,200,.06), 0 2px 6px rgba(254,240,138,.12), 0 6px 16px rgba(0,0,0,.8),
    inset 1px 1px 2px rgba(255,245,220,.4), inset -3px -3px 6px rgba(0,0,0,.75);
}
:root[data-mode="ortho"][data-theme="dark"] .knot::after { background: rgba(255,247,225,.5); }
.knot::after { background: rgba(255,255,255,.3); }
.bead {
  width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, var(--b-hi), var(--b-mid) 55%, var(--b-lo));
  box-shadow: 0 4px 10px var(--shadow), inset 2px 2px 3px rgba(255,255,255,.3), inset -3px -3px 5px rgba(0,0,0,.4);
}
.bead.big {
  width: 40px; height: 40px;
  background: radial-gradient(circle at 32% 26%, var(--big-hi), var(--big-mid) 55%, var(--big-lo));
}
.bead.big::after { width: 28%; height: 16%; background: rgba(255,255,255,.7); }

.knot-cross {
  position: relative; width: 26px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  filter: drop-shadow(0 3px 5px var(--shadow)) drop-shadow(0 0 4px color-mix(in srgb, var(--metal) 55%, transparent));
}
.knot-cross::before {
  content: ""; position: absolute; left: 50%; bottom: -8px; z-index: -1;
  width: 70%; height: 9px; transform: translateX(-50%);
  border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.5), transparent 72%);
}

.floating-prayer {
  position: absolute; left: 0; right: 0; bottom: 12%; padding: 0 24px; box-sizing: border-box;
  text-align: center; font-size: 1.25rem; font-weight: 600; color: var(--accent); pointer-events: none; z-index: 5;
  text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 26px color-mix(in srgb, var(--accent) 45%, transparent);
  opacity: 0; transform: translateY(0) scale(.82);
}
.floating-prayer::before {
  content: ""; position: absolute; inset: -22px -12px; border-radius: 50%; z-index: -1; opacity: 0;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 35%, transparent), transparent 70%);
}
.floating-prayer.rise { animation: floatUp 2.3s cubic-bezier(.16,.84,.44,1) forwards; }
.floating-prayer.rise::before { animation: burst 2.3s ease-out forwards; }
@keyframes floatUp {
  0%   { opacity: 0; transform: translateY(0) scale(.8) rotate(-1deg); filter: blur(0); }
  10%  { opacity: 1; transform: translateY(-4%) scale(1.08) rotate(0deg); }
  75%  { opacity: 1; filter: blur(0); }
  100% { opacity: 0; transform: translateY(calc(-1 * var(--rise))) scale(1.3) rotate(1deg); filter: blur(2px); }
}
@keyframes burst {
  0% { opacity: .9; transform: scale(.3); }
  30% { opacity: .5; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(2.2); }
}

footer {
  width: 100%; max-width: 420px; box-sizing: border-box; z-index: 10;
  padding: 8px 16px max(env(safe-area-inset-bottom), 20px);
  display: flex; flex-direction: column; gap: 8px;
}
select, input[type="text"] {
  width: 100%; box-sizing: border-box; padding: 12px 16px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--panel); color: var(--fg);
  font: inherit; font-size: 16px; text-align: center; text-align-last: center; outline: none;
  user-select: text; -webkit-user-select: text;
}
.row-inline { display: flex; gap: 8px; }
.btn {
  border: 1px solid var(--border); background: var(--panel); color: var(--fg);
  border-radius: 20px; padding: 10px 16px; font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap;
}
.btn.danger { color: #ef4444; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
  align-items: flex-end; justify-content: center; z-index: 50;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border-radius: 22px 22px 0 0; padding: 20px 20px max(env(safe-area-inset-bottom), 24px);
  touch-action: pan-y; border: 1px solid var(--border);
}
.sheet h2 { margin: 0 0 6px; font-size: 1.15rem; }
.row {
  display: flex; justify-content: space-between; align-items: center; gap: 14px;
  padding: 13px 0; border-bottom: 1px solid var(--border);
}
.row .txt { flex: 1; font-size: .98rem; }
.row .hint { display: block; color: var(--muted); font-size: .78rem; margin-top: 3px; line-height: 1.3; }
.row.disabled { opacity: .4; pointer-events: none; }
.row select { width: auto; max-width: 55%; padding: 8px 12px; border-radius: 12px; font-size: 14px; text-align: left; text-align-last: left; }
.switch {
  appearance: none; -webkit-appearance: none; width: 46px; height: 28px; margin: 0; flex: none;
  border-radius: 14px; background: var(--border); position: relative; cursor: pointer; outline: none; transition: background .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
  border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: space-between; }
.note { color: var(--muted); font-size: .8rem; margin-top: 12px; line-height: 1.4; }

/* ---------- Επίπεδα αφοσίωσης ---------- */
.holiness {
  font-size: .78rem; letter-spacing: .3px; color: var(--accent);
  text-align: center; margin-top: 2px; opacity: .88;
}

/* ---------- «Πύλες Παραδείσου» — αχνό φως πίσω από το κομποσχοίνι/ροζάριο ---------- */
.paradise-gate {
  position: absolute; top: 0; left: 50%; width: 100%;
  height: var(--gate-h, 30%);
  transform: translateX(-50%); pointer-events: none; z-index: 0;
  opacity: 0; transition: opacity 1.4s ease, height 1.4s ease;
}
.paradise-gate::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse 58% 100% at 50% 0%,
    rgba(255,251,225,.95) 0%, rgba(255,241,190,.55) 26%, rgba(255,231,155,.2) 50%, transparent 76%);
  filter: blur(8px);
}
.paradise-gate::after {
  content: ""; position: absolute; inset: 0; opacity: .8;
  background: repeating-conic-gradient(from 0deg at 50% 0%,
    rgba(255,255,235,.4) 0deg 3deg, transparent 3deg 15deg);
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(ellipse 62% 95% at 50% 0%, black 0%, transparent 78%);
          mask-image: radial-gradient(ellipse 62% 95% at 50% 0%, black 0%, transparent 78%);
}
.paradise-gate.blessed::before {
  background: radial-gradient(ellipse 62% 100% at 50% 0%,
    rgba(255,253,238,1) 0%, rgba(255,246,205,.65) 28%, rgba(255,235,165,.26) 52%, transparent 78%);
}
.paradise-gate.blessed::after { animation: gateShimmer 3.4s ease-in-out infinite; }
@keyframes gateShimmer { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }

/* ---------- Ενότητα υποστήριξης/δωρεών ---------- */
.support-block { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.support-title { font-weight: 600; font-size: .98rem; margin-bottom: 4px; }
.support-desc { color: var(--muted); font-size: .82rem; line-height: 1.4; margin-bottom: 6px; }
.support-safe { color: var(--muted); font-size: .76rem; line-height: 1.4; margin-bottom: 10px; opacity: .9; }
.blessing-btn {
  width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 1rem; font-weight: 600;
  background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border-color: var(--accent);
}
.support-confirm {
  margin-top: 10px; padding: 12px; border-radius: 14px;
  background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid var(--border);
}
.support-confirm-text { font-size: .82rem; line-height: 1.4; color: var(--fg); margin-bottom: 10px; }
.support-amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.amount-btn {
  padding: 10px 4px; font-size: .95rem; font-weight: 600; text-align: center;
  background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border-color: var(--accent);
}
.support-confirm .row-inline .btn { flex: 1; }
#support-note { color: var(--accent); font-weight: 500; margin-top: 8px; }

/* ---------- Λάμψη ευλογίας σε όλη την εφαρμογή μετά από προσφορά ---------- */
#blessing-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 999; opacity: 0;
  background: radial-gradient(circle at 50% 38%,
    rgba(255,255,245,.95) 0%, rgba(255,246,205,.6) 32%, rgba(255,235,170,.15) 58%, transparent 78%);
}
#blessing-flash.flash { animation: blessingFlash 2.8s ease-out; }
@keyframes blessingFlash {
  0% { opacity: 0; }
  10% { opacity: 1; }
  35% { opacity: .7; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
<div id="blessing-flash" aria-hidden="true"></div>
<header>
  <div class="topbar">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-rosary" role="tab"></button>
      <button class="tab" id="tab-ortho" role="tab"></button>
    </div>
    <button class="icon-btn" id="undo-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="icon-btn" id="theme-btn">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--panel)"/><circle cx="15" cy="12" r="2" fill="var(--panel)"/><circle cx="8" cy="18" r="2" fill="var(--panel)"/></svg>
    </button>
  </div>
  <div class="counters" id="counters"></div>
  <div class="holiness" id="holiness"></div>
</header>

<div id="stage">
  <div class="glow" aria-hidden="true"></div>
  <div class="paradise-gate" id="paradise-gate" aria-hidden="true"></div>
  <div class="pendant" aria-hidden="true" id="pendant"></div>
  <div class="start-hint" id="start-hint" data-i18n="startHint"></div>
  <div class="rope" id="rope">
    <div class="cord"></div>
    <div id="track"></div>
  </div>
</div>

<footer>
  <select id="prayer-select"></select>
  <div class="row-inline" id="custom-box" hidden>
    <input type="text" id="prayer-input" autocomplete="off">
    <button class="btn" id="save-prayer"></button>
  </div>
  <button class="btn danger" id="del-prayer" hidden></button>
</footer>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog">
    <h2 data-i18n="settingsTitle"></h2>
    <label class="row"><span class="txt" data-i18n="hapticBead"></span><input type="checkbox" class="switch" data-key="hapticBead"></label>
    <label class="row"><span class="txt"><span data-i18n="hapticComplete"></span><span class="hint" data-i18n="hapticCompleteHint"></span></span><input type="checkbox" class="switch" data-key="hapticComplete"></label>

}

/* ---------- Δόνηση / ήχος ----------
   Μέσα στην native εφαρμογή (Capacitor) καλούμε το δικό μας native plugin
   "Vibrate", που μιλάει απευθείας στο Android Vibrator API· αυτό δουλεύει
   αξιόπιστα ακόμα και σε συσκευές (π.χ. ορισμένα Xiaomi/MIUI) όπου το
   navigator.vibrate() μέσα σε WebView/Chrome αναφέρει επιτυχία αλλά το
   λειτουργικό σβήνει σιωπηλά την πραγματική δόνηση.
   Αν η εφαρμογή ανοίγει απλά σε browser/PWA, κάνουμε fallback στο κανονικό
   navigator.vibrate().
   Σημείωση: το Capacitor δεν εκθέτει αυτόματα τα native plugins σε
   window.Capacitor.Plugins — πρέπει να γίνει ρητή registerPlugin() μία
   φορά, αλλιώς η κλήση σιωπηλά αποτυγχάνει και κάνει fallback στο
   navigator.vibrate() (το ίδιο πρόβλημα που θέλαμε να λύσουμε). */
const NativeVibrate = (window.Capacitor && typeof window.Capacitor.registerPlugin === 'function')
  ? window.Capacitor.registerPlugin('Vibrate')
  : null;
// Fallback: αν το registerPlugin δεν υπάρχει σε αυτό το build, δοκιμάζουμε
// απευθείας το Plugins.Vibrate (σε περίπτωση που το Capacitor το έχει ήδη
// εκθέσει εκεί χωρίς να χρειάζεται ρητή registerPlugin() κλήση).
const DirectVibratePlugin = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Vibrate)
  ? window.Capacitor.Plugins.Vibrate
  : null;
const VibratePluginProxy = NativeVibrate || DirectVibratePlugin;
function vibrate(p) {
  if (VibratePluginProxy) {
    try {
      if (Array.isArray(p)) VibratePluginProxy.vibrate({ pattern: p });
      else VibratePluginProxy.vibrate({ duration: p });
    } catch (e) {}
    return true;
  }
  if (typeof navigator.vibrate === 'function') {
    try { return navigator.vibrate(p); } catch (e) {}
  }
  return false;
}

/* Η υπενθύμιση "ξέχασες να συνεχίσεις" δεν χρησιμοποιεί το απευθείας
   Vibrator API (VibratePluginProxy.vibrate) — σε ορισμένες συσκευές
   (επιβεβαιωμένο σε πραγματικό Xiaomi/MIUI) η απευθείας κλήση αναφέρει
   επιτυχία αλλά η συσκευή δεν δονείται καθόλου, όταν είναι κλειστή η
   ρύθμιση "δόνηση αφής" — ανεξαρτήτως πώς χαρακτηρίζουμε τη δόνηση στον
   κώδικα. Αντ' αυτού, στέλνουμε μια πραγματική ειδοποίηση συστήματος με
   δόνηση πάνω στο κανάλι της (remindNotify) — περνάει από διαφορετικό
   μηχανισμό δόνησης (κλήσεις/ειδοποιήσεις), που πολλοί χρήστες έχουν
   ενεργό ακόμα κι όταν έχουν κλείσει τη δόνηση αφής. Χρησιμοποιείται μόνο
   εδώ (το πολύ μία φορά ανά παύση), ποτέ ανά χάνδρα/κόμπο, ώστε να μην
   γεμίζει ειδοποιήσεις. */
async function notifyOrVibrate(pattern) {
  if (VibratePluginProxy && typeof VibratePluginProxy.remindNotify === 'function') {
    try {
      const res = await VibratePluginProxy.remindNotify({
        title: T().remindNotifTitle,
        text: T().remindNotifText
      });
      if (res && res.ok) return;
    } catch (e) {}
  }
  vibrate(pattern);
}
let notifPermissionAsked = false;
function ensureNotificationPermission() {
  if (notifPermissionAsked) return;
  notifPermissionAsked = true;
  if (VibratePluginProxy && typeof VibratePluginProxy.requestNotificationPermission === 'function') {
    try { VibratePluginProxy.requestNotificationPermission(); } catch (e) {}
  }
}

let actx = null;
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type, gain, when = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function clickSound(kind) {
  if (!S.settings.sound) return;
  if (S.mode === 'ortho') tone(220, 110, 0.10, 'sine', 0.35);
  else if (kind === 'big') tone(420, 260, 0.20, 'triangle', 0.4);
  else tone(1200, 600, 0.05, 'triangle', 0.25);
}
function chime() {
  if (!S.settings.sound) return;

}
// Ξεχωριστός ήχος υπενθύμισης (ελέγχεται από το δικό του setting,
// remindSound — όχι από το sound του κλικ ανά χάνδρα/κόμπο).
function remindTone() {
  tone(520, 340, 0.18, 'sine', 0.3);
  tone(520, 340, 0.18, 'sine', 0.3, 0.22);
}

/* ---------- Οθόνη αναμμένη ---------- */

}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') requestWake(); });

/* ---------- Γραφικό (track) ---------- */
let N = 9, slots = [];
const kindAt = j => S.mode === 'ortho'
  ? ((((j % TOTAL_KNOTS) + TOTAL_KNOTS) % TOTAL_KNOTS) === 0 ? 'cross' : 'knot')
  : ((((j % CYCLE) + CYCLE) % CYCLE) === 0 ? 'big' : 'bead');

function buildSlots() {
  finalizeAnim();
  const h = rope.clientHeight || 400;
  N = Math.max(7, Math.ceil(h / STEP) + 2);
  if (N % 2 === 0) N++;
  track.style.height = (N * STEP) + 'px';
  track.style.top = ((h - N * STEP) / 2) + 'px';
  track.innerHTML = '';
  slots = [];
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'slot';
    track.appendChild(d);
    slots.push(d);
  }
  renderTrack();
}
function renderTrack() {
  const F = (N - 1) / 2;
  const pos = S.mode === 'rosary' ? cur().pos : cur().bead;
  const d = swipeDir || 1;
  slots.forEach((slot, s) => {
    const k = kindAt(pos + d * (F - s));
    if (slot.dataset.k !== k) {
      slot.dataset.k = k;
      slot.innerHTML = k === 'knot' ? '<div class="knot"></div>'
        : k === 'big' ? '<div class="bead big"></div>'
        : k === 'cross' ? '<div class="knot-cross"><svg viewBox="0 0 26 34" width="26" height="34"><g fill="var(--metal)"><rect x="10" y="0" width="4" height="30" rx="1.5"/><rect x="3" y="6" width="18" height="3.4" rx="1.4"/><rect x="5.5" y="15" width="13" height="3.4" rx="1.4"/></g></svg></div>'
        : '<div class="bead"></div>';
    }
  });
}
function endAnim() {
  track.style.transition = 'none';
  renderTrack();
  track.style.transform = 'translateY(0)';
  void track.offsetHeight;
}
function finalizeAnim() {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; endAnim(); }
}
function animateStep() {
  const d = swipeDir || 1;
  track.style.transition = 'transform .22s cubic-bezier(.25,1,.5,1)';
  track.style.transform = 'translateY(' + (STEP * d) + 'px)';
  animTimer = setTimeout(() => { animTimer = null; endAnim(); }, 230);
}

function renderCounters() {
  const c = cur(), o = override || {}, t = T();
  const bead = o.bead !== undefined ? o.bead : c.bead;
  const el = $('counters');
  if (S.mode === 'ortho') {
    el.innerHTML = t.countKnots + ' <span>' + bead + '</span> / ' + TOTAL_KNOTS +
      ' &nbsp;|&nbsp; ' + t.countRosariesOrtho + ' <span>' + c.rosary + '</span>';
  } else {
    const dec = (o.decade !== undefined ? o.decade : c.decade) + 1;
    el.innerHTML = t.countBead + ' <span>' + bead + '</span> / ' + BEADS_PER_DECADE +
      ' &nbsp;·&nbsp; ' + t.countDecade + ' <span>' + dec + '</span> / ' + DECADES +
      ' &nbsp;·&nbsp; ' + t.countRosariesR + ' <span>' + c.rosary + '</span>';
  }
  undoBtn.disabled = hist.length === 0;
  renderHoliness();
}
function ensureDaily() {
  if (!S.daily) S.daily = { date: todayStr(), laps: 0, blessedToday: false };
  if (S.daily.date !== todayStr()) { S.daily.date = todayStr(); S.daily.laps = 0; S.daily.blessedToday = false; }
}
function lapProgressFraction() {
  // πρόοδος μέσα στο τρέχον, ανολοκλήρωτο κομποσχοίνι/ροζάριο (0..1) — για ζωντανή, ανά-πέρασμα ανάδραση
  if (S.mode === 'ortho') return S.counts.ortho.bead / TOTAL_KNOTS;
  const c = S.counts.rosary;
  return (c.decade * BEADS_PER_DECADE + c.bead) / (DECADES * BEADS_PER_DECADE);
}
function holinessLevel(laps) {
  let lvl = 0;
  for (let i = 0; i < LEVEL_THRESHOLDS.length; i++) if (laps >= LEVEL_THRESHOLDS[i]) lvl = i;
  return lvl;
}
function renderHoliness() {
  ensureDaily();
  const max = LEVEL_THRESHOLDS.length - 1;
  const laps = S.daily.laps;
  const lvl = holinessLevel(laps);
  const names = LEVELS[L()] || LEVELS.en;
  const el = $('holiness');
  if (el) el.textContent = '✦ ' + (names[lvl] || names[0]);
  const gate = $('paradise-gate');
  if (gate) {
    // ομαλή, συνεχής αύξηση μέσα στο επίπεδο — αλλάζει σε κάθε πέρασμα κόμπου/χάνδρας, όχι μόνο σε ολοκλήρωση
    const prevT = LEVEL_THRESHOLDS[lvl];
    const nextT = LEVEL_THRESHOLDS[Math.min(lvl + 1, max)];
    const span = Math.max(nextT - prevT, 1);
    const within = lvl >= max ? 1 : Math.min((laps - prevT + lapProgressFraction()) / span, 1);
    const frac = (lvl + within) / max;
    // ξεκινά μικρή/αχνή και φτάνει σχεδόν στο μήκος του ορατού κομποσχοινιού, αισθητά πιο φωτεινή, στα 15 κομποσχοίνια της ημέρας
    gate.style.opacity = (0.05 + frac * 0.95).toFixed(3);
    gate.style.setProperty('--gate-h', (14 + frac * 84) + '%');
    gate.classList.toggle('blessed', !!S.daily.blessedToday);
  }
}
function flashBlessing() {
  const f = $('blessing-flash');
  if (!f) return;
  f.classList.remove('flash');
  void f.offsetWidth;
  f.classList.add('flash');
  setTimeout(() => f.classList.remove('flash'), 2900);
}
function setOverride(o) {
  override = o;
  clearTimeout(overrideTimer);
  overrideTimer = setTimeout(() => { override = null; renderCounters(); }, 750);
}
function clearOverride() { override = null; clearTimeout(overrideTimer); }

/* ---------- Προσευχές ---------- */
function buildSelect() {
  const t = T();
  sel.innerHTML = '';
  const g1 = document.createElement('optgroup'); g1.label = t.optgroupPrayers;
  PRAYERS[S.mode][L()].forEach((txt, i) => g1.appendChild(new Option(txt, 'b:' + i)));
  sel.appendChild(g1);
  if (S.custom.length) {
    const g2 = document.createElement('optgroup'); g2.label = t.optgroupMine;
    S.custom.forEach(c => g2.appendChild(new Option(c.text, 'c:' + c.id)));
    sel.appendChild(g2);
  }
  sel.appendChild(new Option(t.freeOption, 'free'));
  let v = S.selected[S.mode];
  if (![...sel.options].some(o => o.value === v)) v = 'b:0';
  S.selected[S.mode] = v;
  sel.value = v;
  syncFooter();
}
function syncFooter() {
  const v = S.selected[S.mode];
  customBox.hidden = v !== 'free';
  $('del-prayer').hidden = !v.startsWith('c:');
  if (v === 'free') prayerInput.value = S.free[S.mode];
}
function prayer() {
  const v = S.selected[S.mode];
  if (v.startsWith('b:')) return PRAYERS[S.mode][L()][+v.slice(2)] || '';
  if (v.startsWith('c:')) { const c = S.custom.find(x => x.id === v.slice(2)); return c ? c.text : ''; }
  return (S.free[S.mode] || '').trim();
}
function spawnPrayer(text) {
  if (!text) return;
  const el = document.createElement('div');
  el.className = 'floating-prayer';
  el.textContent = text;
  stage.appendChild(el);
  const rect = el.getBoundingClientRect();
  const rise = rect.top + rect.height + 24;
  el.style.setProperty('--rise', rise + 'px');
  requestAnimationFrame(() => el.classList.add('rise'));
  setTimeout(() => el.remove(), 2500);
}

sel.addEventListener('change', () => { S.selected[S.mode] = sel.value; syncFooter(); save(); sel.blur(); });
prayerInput.addEventListener('input', () => { S.free[S.mode] = prayerInput.value; save(); });
$('save-prayer').addEventListener('click', () => {
  const text = prayerInput.value.trim();
  if (!text) return;
  let c = S.custom.find(x => x.text === text);
  if (!c) { c = { id: Date.now().toString(36), text }; S.custom.push(c); }
  S.selected[S.mode] = 'c:' + c.id;
  S.free[S.mode] = '';
  buildSelect(); save();
});
$('del-prayer').addEventListener('click', () => {
  const v = S.selected[S.mode];
  if (!v.startsWith('c:') || !confirm(T().confirmDelete)) return;
  const id = v.slice(2);
  S.custom = S.custom.filter(x => x.id !== id);
  ['ortho', 'rosary'].forEach(m => { if (S.selected[m] === v) S.selected[m] = 'b:0'; });
  buildSelect(); save();
});

/* ---------- Έναρξη πρώτης κίνησης ---------- */
function hideStartHint() {
  const h = $('start-hint');
  if (!h) return;
  h.style.opacity = '0';
  setTimeout(() => h.remove(), 400);
}

/* ---------- Κύρια λογική: ένα «πέρασμα» κόμπου ---------- */
function pass() {
  finalizeAnim();
  if (!firstPassDone) { firstPassDone = true; hideStartHint(); }
  const c = cur();
  hist.push(JSON.stringify(c));
  if (hist.length > 30) hist.shift();
  clearOverride();
  markSwipeTime();
  requestWake();

  let completed = null, text = '', kind = 'knot';
  if (S.mode === 'ortho') {
    c.bead++;
    text = prayer();
    if (c.bead >= TOTAL_KNOTS) {
      c.bead = 0; c.rosary++;
      completed = { type: 'rosary', override: { bead: TOTAL_KNOTS } };
    }
  } else {
    kind = kindAt(c.pos);
    if (kind === 'big') text = (BIG_PRAYERS[S.settings.bigPrayer] || BIG_PRAYERS.none)[L()] || '';
    else { c.bead++; text = prayer(); }
    c.pos = (c.pos + 1) % CYCLE;
    if (kind === 'bead' && c.bead >= BEADS_PER_DECADE) {
      const ov = { bead: BEADS_PER_DECADE, decade: c.decade };
      c.bead = 0; c.decade++;
      if (c.decade >= DECADES) { c.decade = 0; c.rosary++; completed = { type: 'rosary', override: ov }; }
      else completed = { type: 'decade', override: ov };
    }
  }

  if (completed) {
    if (completed.type === 'rosary') { ensureDaily(); S.daily.laps++; }
    if (S.settings.hapticComplete) vibrate(completed.type === 'rosary' ? [50, 80, 50, 80, 90] : [50, 80, 50]);
    chime();
    setOverride(completed.override);
  } else {
    if (S.settings.hapticBead) vibrate(kind === 'big' ? 60 : 35);
    clickSound(kind);
  }
  spawnPrayer(text);
  animateStep();
  renderCounters();
  save();
  scheduleReminder();
}

function undo() {
  finalizeAnim();
  const snap = hist.pop();
  if (!snap) return;
  clearOverride();
  S.counts[S.mode] = JSON.parse(snap);
  renderTrack(); renderCounters(); save();
  clearTimeout(idleTimer);
}

/* ---------- Υπενθύμιση όταν ξεχαστείς ---------- */
function markSwipeTime() {
  const now = Date.now();
  if (lastSwipe !== null) {
    const dt = now - lastSwipe;
    if (dt <= MAX_INTERVAL_MS) lastIntervalMs = Math.max(dt, 250);
  }
  lastSwipe = now;
}
function scheduleReminder() {
  clearTimeout(idleTimer);
  if (!S.settings.remind) return;
  idleTimer = setTimeout(remind, Math.max(lastIntervalMs * 2, MIN_REMIND_MS));
}
function remind() {
  if (document.hidden) return;
  notifyOrVibrate(S.settings.remindStrong ? [150, 90, 150, 90, 260] : [40, 60, 40]);
  if (S.settings.remindSound) remindTone();
  rope.classList.remove('pulse'); void rope.offsetWidth; rope.classList.add('pulse');
  setTimeout(() => rope.classList.remove('pulse'), 600);
}

/* ---------- Είσοδος: swipe (καθορίζει φορά), πληκτρολόγιο ---------- */
let startY = null;
stage.addEventListener('pointerdown', e => { if (e.isPrimary) startY = e.clientY; });
window.addEventListener('pointerup', e => {
  if (startY === null) return;
  const dy = e.clientY - startY; startY = null;
  if (Math.abs(dy) < 30) return;
  const dir = dy > 0 ? 1 : -1;
  if (swipeDir === null) swipeDir = dir;
  if (dir === swipeDir) pass();
});
window.addEventListener('pointercancel', () => { startY = null; });

window.addEventListener('keydown', e => {
  if (overlay.classList.contains('open')) { if (e.key === 'Escape') closeSettings(); return; }
  if (e.target.closest && e.target.closest('input,select,textarea,button')) return;
  if (e.code === 'Space' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (!e.repeat) { if (swipeDir === null) swipeDir = 1; pass(); }
  } else if (e.key === 'ArrowUp' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z')) {
    e.preventDefault(); undo();
  }
});
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });

/* ---------- Μεταφράσεις UI ---------- */
function buildLangSelect() {

function applyStrings() {
  const t = T(), lc = L();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = STR[lc][key] !== undefined ? STR[lc][key] : STR.en[key];
    if (val !== undefined) el.textContent = val;
  });
  $('tab-ortho').textContent = t.tabName_ortho;
  $('tab-ortho').setAttribute('aria-label', t.tabAria_ortho);
  $('tab-rosary').textContent = t.tabName_rosary;
  $('tab-rosary').setAttribute('aria-label', t.tabAria_rosary);
  undoBtn.title = t.undo; undoBtn.setAttribute('aria-label', t.undo);
  $('theme-btn').setAttribute('aria-label', t.toggleTheme);
  $('settings-btn').setAttribute('aria-label', t.settingsAria);
  sel.setAttribute('aria-label', t.prayerSelectAria);
  prayerInput.placeholder = t.inputPlaceholder;
  $('save-prayer').textContent = t.save;
  $('del-prayer').textContent = t.deletePrayer;
  document.documentElement.lang = lc;
  document.documentElement.dir = RTL_LANGS.includes(lc) ? 'rtl' : 'ltr';
}

/* ---------- Mode & θέμα ---------- */
function applyTheme() {
  root.dataset.theme = S.theme;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.body).backgroundColor;
}
function applyMode() {
  root.dataset.mode = S.mode;
  $('tab-ortho').setAttribute('aria-selected', S.mode === 'ortho');
  $('tab-rosary').setAttribute('aria-selected', S.mode === 'rosary');
  $('row-big').hidden = S.mode !== 'rosary';
  renderPendant();
  buildSelect();
  buildSlots();
  renderCounters();
  applyTheme();
  applyStrings();
}
function setMode(m) {
  if (m === S.mode) return;
  finalizeAnim(); clearTimeout(idleTimer); clearOverride();
  S.mode = m; hist = []; lastSwipe = null; lastIntervalMs = DEFAULT_INTERVAL_MS;
  applyMode(); save();
}
$('tab-ortho').addEventListener('click', () => setMode('ortho'));
$('tab-rosary').addEventListener('click', () => setMode('rosary'));
$('theme-btn').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); });
undoBtn.addEventListener('click', undo);

/* ---------- Ρυθμίσεις UI ---------- */
function syncSettingsUI() {
  overlay.querySelectorAll('[data-key]').forEach(el => {
    const k = el.dataset.key;
    if (k === 'lang') { el.value = L(); return; }
    if (el.type === 'checkbox') el.checked = !!S.settings[k]; else el.value = S.settings[k];
  });
  $('row-strong').classList.toggle('disabled', !S.settings.remind);
  $('row-remind-sound').classList.toggle('disabled', !S.settings.remind);
  $('vib-note').hidden = !!navigator.vibrate;
}
overlay.querySelectorAll('[data-key]').forEach(el => {
  el.addEventListener('change', () => {
    const k = el.dataset.key;
    if (k === 'lang') {
      S.lang = el.value;
      buildSelect(); applyStrings(); renderCounters(); save();
      return;
    }
    S.settings[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'sound' && S.settings.sound) tone(1200, 600, 0.05, 'triangle', 0.25);
    if (k === 'hapticBead' && S.settings.hapticBead) vibrate(35);
    if (k === 'remindStrong' && S.settings.remindStrong) vibrate([150, 90, 150, 90, 260]);
    if (k === 'wakeLock') { S.settings.wakeLock ? requestWake() : releaseWake(); }
    if (k === 'remind') {
      if (!S.settings.remind) clearTimeout(idleTimer);
      else ensureNotificationPermission();
      syncSettingsUI();
    }
    save();
  });
});
function openSettings() {
  syncSettingsUI();
  $('support-confirm').hidden = true;
  $('blessing-btn').hidden = false;
  overlay.classList.add('open');
}
function closeSettings() { overlay.classList.remove('open'); }
$('settings-btn').addEventListener('click', openSettings);
$('close-settings').addEventListener('click', closeSettings);
overlay.addEventListener('click', e => { if (e.target === overlay) closeSettings(); });
$('vib-diag-btn').addEventListener('click', runVibrationDiagnostic);
$('reset-btn').addEventListener('click', () => {
  if (!confirm(T().confirmReset)) return;
  finalizeAnim(); clearOverride(); clearTimeout(idleTimer);
  S.counts[S.mode] = defaults().counts[S.mode];
  S.daily = { date: todayStr(), laps: 0, blessedToday: false };
  hist = [];
  renderTrack(); renderCounters(); save(); closeSettings();
});

/* ---------- Υποστήριξη / προαιρετική προσφορά (honor system, χωρίς server) ---------- */
const blessingBtn = $('blessing-btn'), supportConfirm = $('support-confirm');
blessingBtn.addEventListener('click', () => {
  // πρώτα εξηγούμε πού οδηγεί και γιατί είναι ασφαλές, μετά δείχνουμε τα ποσά
  blessingBtn.hidden = true;
  supportConfirm.hidden = false;
});
$('support-cancel').addEventListener('click', () => {
  supportConfirm.hidden = true;
  blessingBtn.hidden = false;
});
document.querySelectorAll('.amount-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    window.open(btn.dataset.amountUrl, '_blank', 'noopener');
    if (!S.support) S.support = { count: 0 };
    S.support.count = (S.support.count || 0) + 1;
    ensureDaily();
    S.daily.laps += GIFT_BONUS_LAPS;
    S.daily.blessedToday = true;
    save();
    renderHoliness();
    flashBlessing();
    supportConfirm.hidden = true;
    blessingBtn.hidden = false;
    const note = $('support-note');
    note.textContent = (T().supportThanks || STR.en.supportThanks);
    note.hidden = false;
    clearTimeout(note._t);
    note._t = setTimeout(() => { note.hidden = true; }, 4500);
    if (S.settings.hapticComplete) vibrate([40, 60, 40, 60, 90]);
    chime();
  });
});

/* ---------- Εκκίνηση ---------- */
buildLangSelect();
applyMode();
if ('ResizeObserver' in window) new ResizeObserver(() => buildSlots()).observe(rope);
else window.addEventListener('resize', buildSlots);
requestWake();
if (S.settings.remind) ensureNotificationPermission();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
